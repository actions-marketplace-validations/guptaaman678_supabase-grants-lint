name: Bug report
description: Something is broken (a crash, a wrong exit code, a wrong parse)
labels: ['bug']
body:
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Output of `supabase-grants-lint --version`
      placeholder: '0.1.0'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal SQL repro
      description: >
        The smallest migration file (or files) that reproduces the problem.
        Please remove anything specific to your project; a synthetic table
        name is fine.
      render: sql
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full command you ran and its output.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node version
      placeholder: 'macOS 14, Node 22.16.0'
    validations:
      required: false
